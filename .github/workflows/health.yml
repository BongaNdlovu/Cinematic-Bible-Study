name: health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke test the live site
        run: node tools/smoke.mjs
      - name: Open an alert
        if: failure()
        run: node tools/ci/alert.mjs fail "live site health"
      - name: Close the alert
        if: success()
        run: node tools/ci/alert.mjs recover "live site health"
