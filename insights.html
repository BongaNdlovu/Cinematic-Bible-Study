<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study insights — The Scroll of Daniel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=29">
  <link rel="stylesheet" href="css/terms.css">
  <style>
    .insights-main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
    .insights-main h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2rem; margin: 0 0 .4rem; }
    .insights-lead, .insights-gate { color: var(--muted, #8a7d68); font-size: 14px; line-height: 1.5; }
    .insights-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
    .insights-toolbar button { font: inherit; font-size: 12px; padding: .4rem .7rem; border: 1px solid var(--line, rgba(196,162,90,.35)); background: transparent; color: inherit; cursor: pointer; }
    .insights-toolbar button.is-on { background: #1c1914; color: #f7f1e4; }
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .insights-panel { border: 1px solid var(--line, rgba(196,162,90,.35)); background: var(--panel, rgba(28,25,20,.6)); padding: 14px 14px 12px; }
    .insights-panel h2 { font-size: 14px; margin: 0 0 10px; letter-spacing: .04em; text-transform: uppercase; }
    .insights-panel .ibar { display: grid; grid-template-columns: 7.5rem 1fr 2.4rem; gap: 8px; align-items: center; font-size: 12px; margin: 0 0 6px; }
    .insights-panel .ibar i { display: block; height: 8px; background: #c4a25a; min-width: 0; }
    .insights-panel .ibar b { text-align: right; font-weight: 600; }
    .insights-panel ul { margin: 0; padding-left: 1.1rem; font-size: 13px; line-height: 1.45; }
    .insights-panel li { margin: 0 0 .4rem; }
    .insights-empty { font-size: 13px; opacity: .7; }
    .insights-csv { float: right; font-size: 11px; border: 0; background: transparent; color: inherit; opacity: .7; cursor: pointer; }
  </style>
  <script src="js/shared/journey.js"></script>
  <script src="js/shared/auth-config.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="js/shared/errors.js"></script>
  <script src="js/shared/auth.js"></script>
  <script src="js/shared/terms.js"></script>
  <script src="js/shared/insights.js"></script>
  <script src="js/insights/insights.js"></script>
</head>
<body class="site">
  <nav class="site-nav">
    <a class="site-brand" href="index.html">THE SCROLL OF DANIEL</a>
    <div class="site-links">
      <a href="index.html">Home</a>
      <a href="study.html">The Sitting</a>
      <a href="insights.html" class="active">Insights</a>
      <span class="auth-slot" data-auth-slot data-auth-variant="nav"></span>
    </div>
  </nav>
  <main class="insights-main">
    <h1>Study insights</h1>
    <p class="insights-lead">Moderator only. Lesson funnel, quiz answers, feedback, and referrals. Nothing here is sold or used for advertising.</p>
    <p class="insights-gate" id="insights-gate">Sign in with the moderator account to open this page.</p>
    <div id="insights-app" hidden>
      <div class="insights-toolbar" id="insights-range">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30" class="is-on">30 days</button>
        <button type="button" data-days="90">90 days</button>
        <button type="button" data-days="0">All</button>
      </div>
      <div class="insights-grid" id="insights-grid"></div>
    </div>
  </main>
</body>
</html>
